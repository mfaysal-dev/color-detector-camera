<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Detector | mfaysal.com</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-palette"></i> ক্যামেরা রঙ শনাক্তকারী</h1>
            <p class="domain">mfaysal.com</p>
        </header>

        <div class="camera-section">
            <div class="video-wrapper">
                <video id="cam" autoplay playsinline muted></video>
                <div class="crosshair"></div>
            </div>
            <button id="startBtn" class="btn primary">
                <i class="fas fa-camera"></i> ক্যামেরা চালু করুন
            </button>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div class="color-card">
                <div class="color-preview" id="colorPreview"></div>
                <h2 class="color-name" id="colorName">---</h2>
                <p class="color-hex">HEX: <span id="colorHex">#000000</span></p>
                <p class="color-rgb">RGB: <span id="colorRgb">0, 0, 0</span></p>
            </div>
        </div>

        <footer>
            <p>© 2026 mfaysal.com — সর্বস্বত্ব সংরক্ষিত</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
